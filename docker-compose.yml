services:
  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      FRONTEND_URL: http://localhost:5500
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    image: nginx:alpine
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    ports:
      - "5500:80"
    depends_on:
      - backend
